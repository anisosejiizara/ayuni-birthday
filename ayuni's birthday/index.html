<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday 👑</title>

<!-- Fancy fonts from Google Fonts (needs internet) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. THEME COLORS  (change these to restyle everything)
   ========================================================= */
@font-face {
  font-family: "MyFont";
  src: url(fonts/AMORIA.otf);
}
@font-face {
  font-family: "myscdfont";
  src: url(fonts/Magic\ Retro.ttf);
}
@font-face {
  font-family: "font01";
  src: url(fonts/WestburyPress_PERSONAL_USE_ONLY.otf);
}
@font-face {
  font-family: "font02";
  src: url(fonts/kiddos_2/KIdDOS-Regular.otf);
}
   :root {
  --maroon-dark: #3d0a16;
  --maroon: #6b1226;
  --maroon-light: #8c1d38;
  --gold: #d4af37;
  --gold-light: #f3dc8a;
  --cream: #fbefdc;
  --blush: #f6c6cf;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'MyFont', sans-serif;
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  background: radial-gradient(circle at 50% 0%, var(--maroon-light), var(--maroon) 45%, var(--maroon-dark) 100%);
  background-attachment: fixed;
}

/* soft gold dots, like old wallpaper */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(212,175,55,.18) 1.5px, transparent 1.5px);
  background-size: 34px 34px;
  pointer-events: none;
}

/* floating hearts & sparkles layer */
#sparkles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
#sparkles span { position: absolute; bottom: -40px; animation: rise linear infinite; }
@keyframes rise {
  from { transform: translateY(0) rotate(0deg); }
  to   { transform: translateY(-115vh) rotate(360deg); }
}

/* =========================================================
   2. PAGES  (only one page is visible at a time)
   ========================================================= */
.page { display: none; position: relative; z-index: 1; min-height: 100vh; padding: 40px 20px; }
.page.active { display: block; animation: pageIn 1s ease both; }
#page-password.active,
#page-letter.active,
#page-gift.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: none; }
}

/* shared bits */
.script { font-family: 'myscdfont', cursive; font-weight: 400; color: var(--gold-light);
          text-shadow: 0 0 18px rgba(243,220,138,.45), 0 2px 4px rgba(0,0,0,.4); }
.divider { color: var(--gold); letter-spacing: 10px; margin: 10px 0; }

.keypad {
  display: grid;
  grid-template-columns: 80px 80px 80px;
  gap: 10px;
  max-width: 255px;
  margin: 0 auto 20px;
}

.enter { 
  width: 80px;
  height: 80px;
  border-radius: 50%;
  font-size: 1rem;
  font-weight: 700;
  font-display: auto;
  cursor: pointer;
  justify-content: center;
  background: rgb(255, 239, 146);
  color: var(--maroon);
  border: 2px solid var(--gold);
  font-family: inherit;
  transition: transform 0.15s, background 0.15s;
}

.delete {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  font-size: 2rem;
  font-weight: 200;
  font-display: auto;
  cursor: pointer;
  justify-content: center;
  background: rgba(255, 255, 255, 0.12);
  color: var(--gold-light);
  border: 2px solid var(--gold);
  font-family: nofont;
  transition: transform 0.15s, background 0.15s;
}

.key { 
  width: 80px;
  height: 80px;
  border-radius: 50%;
  font-size: 2rem;
  font-weight: 700;
  font-display: auto;
  cursor: pointer;
  justify-content: center;
  background: rgba(255, 255, 255, 0.12);
  color: var(--gold-light);
  border: 2px solid var(--gold);
  font-family: inherit;
  transition: transform 0.15s, background 0.15s;
}

.key:hover { background: rgba(255, 255, 255, 0.25);}
.key:active { transform: scale(0.92); }
.btn {
  font-family: inherit; font-size: 1.25rem; font-weight: 700;
  color: var(--maroon-dark);
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none; border-radius: 999px; padding: 12px 34px; cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.35);
  transition: transform .2s;
}
.key:last-child {
  grid-column: 2
}
.btn:hover { transform: scale(1.07); }

/* =========================================================
   3. PAGE 1 - PASSWORD
   ========================================================= */
.card {
  width: 100%; max-width: 420px; text-align: center;
  padding: 40px 30px;
  background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
  border: 2px solid var(--gold); border-radius: 28px;
  box-shadow: 0 0 0 6px rgba(212,175,55,.15), 0 20px 50px rgba(0,0,0,.45);
  backdrop-filter: blur(4px);
}
.crown { font-size: 3.2rem; animation: float 3s ease-in-out infinite; display: inline-block; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.card h1 { font-size: 3.2rem; line-height: 1.1; margin: 6px 0; }
.card p  { font-size: 1.3rem; font-style: italic; margin-bottom: 18px; }

.card input {
  width: 100%; padding: 12px 20px; margin-bottom: 16px;
  font-family: "font02"; font-size: 1.3rem; text-align: center;
  color: var(--maroon-dark); background: var(--cream);
  border: 3px solid var(--gold); border-radius: 999px; outline: none;
}
.card input::placeholder { color: rgba(107,18,38,.45); }
.card input:focus { box-shadow: 0 0 0 4px rgba(243,220,138,.4); }

.error { min-height: 1.6rem; margin-top: 14px; color: var(--blush); font-style: italic; }
.shake { animation: shake .5s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-10px); } 40% { transform: translateX(10px); }
  60% { transform: translateX(-8px); }  80% { transform: translateX(8px); }
}

/* =========================================================
   4. PAGE 2 - CELEBRATION (title, gold frames, envelope)
   ========================================================= */
.hero { min-height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hero .crown { font-size: 3.5rem; }

.hb-title {
  font-family: 'Great Vibes', cursive; font-weight: 400; white-space: nowrap;
  font-size: clamp(2.8rem, 11vw, 6.5rem); color: var(--gold-light);
  text-shadow: 0 0 20px rgba(243,220,138,.55), 0 3px 6px rgba(0,0,0,.5);
}
.hb-title span { display: inline-block; animation: wave 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * 0.1s); }
@keyframes wave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

.to { font-size: 1.8rem; font-style: italic; margin-top: 8px; }
.scroll-hint { margin-top: 40px; color: var(--gold-light); animation: bounce 1.6s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

/* gallery grid */
.gallery {
  max-width: 1000px; margin: 40px auto 20px;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 50px 34px;
}

/* GOLDEN FRAME */
.frame {
  position: relative; padding: 14px; border-radius: 6px;
  background: linear-gradient(135deg, #f6e27a, #c99a2e 40%, #f6e27a 60%, #a67c1a);
  box-shadow: 0 10px 25px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.35);
  opacity: 0; transform: translateY(40px) rotate(var(--tilt));
  transition: opacity .9s ease, transform .9s ease;
}
.frame.show { opacity: 1; transform: translateY(0) rotate(var(--tilt)); }
.frame.show:hover { transform: scale(1.05) rotate(0deg); }
.frame::before {            /* little heart bow on top */
  content: "♥"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  font-size: 1.8rem; color: var(--blush); text-shadow: 0 2px 4px rgba(0,0,0,.5);
}
.frame .mat { padding: 8px; background: var(--cream); box-shadow: inset 0 0 8px rgba(0,0,0,.45); }
.frame img, .placeholder { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.placeholder { display: flex; align-items: center; justify-content: center; text-align: center;
               background: linear-gradient(160deg, var(--maroon-light), var(--maroon)); color: var(--gold-light);
               font-size: 1.3rem; font-style: italic; }
.frame figcaption { font-family: "font01", cursive; color: var(--maroon); text-align: center; font-size: 1.6rem; padding-top: 6px; }

/* ENVELOPE */
.envelope-wrap { text-align: center; margin: 90px 0 80px; }
.envelope-wrap .line { font-size: 1.2rem; font-style: italic; margin-bottom: 70px; }
.envelope { position: relative; width: 260px; height: 170px; margin: 0 auto; cursor: pointer;
            animation: bounce 2s ease-in-out infinite; }
.envelope.open { animation: none; }
.envelope > div { position: absolute; }
.env-back  { inset: 0; background: #f4b9c6; border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.env-letter { left: 8%; right: 8%; top: 12px; height: 130px; background: var(--cream); border-radius: 4px; z-index: 2;
              background-image: repeating-linear-gradient(to bottom, transparent 0 16px, rgba(107,18,38,.2) 16px 17px);
              transition: transform .9s ease .5s; }
.env-front { inset: 0; background: #eaa3b3; z-index: 3; border-radius: 8px;
             clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%); }
.env-flap  { inset: 0; background: #d9899b; z-index: 4; transform-origin: top center;
             clip-path: polygon(0 0, 100% 0, 50% 58%);
             transition: transform .8s ease, z-index 0s .4s; }
.env-seal  { left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
             width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
             background: radial-gradient(circle at 35% 30%, var(--maroon-light), var(--maroon-dark));
             color: var(--gold-light); font-size: 1.3rem; box-shadow: 0 3px 8px rgba(0,0,0,.5);
             transition: opacity .4s; }
.envelope.open .env-flap   { transform: rotateX(180deg); z-index: 1; }
.envelope.open .env-letter { transform: translateY(-95px); }
.envelope.open .env-seal   { opacity: 0; }
.tap { margin-top: 26px; color: var(--gold-light); font-style: italic; font-size: 1.3rem; }

/* =========================================================
   5. PAGE 3 - THE LETTER
   ========================================================= */
.letter {
  position: relative; width: 100%; max-width: 580px; padding: 50px 36px 40px;
  background: var(--cream); color: var(--maroon-dark); border-radius: 6px;
  box-shadow: 0 25px 60px rgba(0,0,0,.55);
  transform-origin: top center; animation: unfold 1.2s ease both;
}
.letter::before { content: ""; position: absolute; inset: 10px; border: 3px double var(--gold); border-radius: 4px; pointer-events: none; }
@keyframes unfold { from { opacity: 0; transform: scaleY(.1); } to { opacity: 1; transform: scaleY(1); } }
.letter h2 { font-family: "font01", cursive; font-weight: 400; font-size: 2.6rem; color: var(--maroon); margin-bottom: 14px; }
.letter p { font-size: 1.35rem; line-height: 1.6; margin-bottom: 14px; font-family: "font02"; }
.letter .sign { font-family: "MyFont", cursive; font-size: 1rem; color: var(--maroon); text-align: right; margin-top: 20px; }
.letter-btn { margin-top: 30px; text-align: center; font-size: 15px;}

/* =========================================================
   6. PAGE 4 - THE GIFT (3D spinning bouquet)
   ========================================================= */
#page-gift h1 { font-size: clamp(2.6rem, 9vw, 4.2rem); text-align: center; }
.scene { position: relative; width: 100%; height: 430px; perspective: 1000px;
         display: flex; align-items: center; justify-content: center; margin: 10px 0; }
.stage { position: relative; width: 0; height: 0; transform-style: preserve-3d; animation: spin 18s linear infinite; }
@keyframes spin   { to { transform: rotateY(360deg); } }
@keyframes unspin { to { transform: rotateY(-360deg); } }  /* keeps flowers facing you */

.bb { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.bb-inner { animation: unspin 18s linear infinite; }

.flower { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.flower i { position: absolute; border-radius: 50% 50% 45% 45%; transform-origin: 50% 100%;
            width: calc(var(--s) * .34); height: calc(var(--s) * .55);
            left: calc(var(--s) * -.17); top: calc(var(--s) * -.55);
            box-shadow: inset 0 -4px 6px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.2); }
.flower b { position: absolute; border-radius: 50%;
            width: calc(var(--s) * .26); height: calc(var(--s) * .26);
            left: calc(var(--s) * -.13); top: calc(var(--s) * -.13);
            background: radial-gradient(circle, #ffe9a3, var(--gold)); }
.leaf { position: absolute; width: 20px; height: 52px; left: -10px; top: -52px; transform-origin: 50% 100%;
        border-radius: 50% 0 50% 0; background: linear-gradient(160deg, #6fa75f, #3f6b3a); }
.dot  { position: absolute; width: 7px; height: 7px; left: -3px; top: -3px; border-radius: 50%; background: #fff7ea; }
.cone { position: absolute; left: -100px; top: 0; width: 200px; height: 190px;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        background:
          linear-gradient(to bottom, transparent 20%, var(--gold) 20% 27%, transparent 27%),
          repeating-linear-gradient(135deg, #7a1530 0 14px, #8c1d38 14px 28px); }
.gift-text { font-size: 1.0rem; font-style: italic; text-align: center; max-width: 480px; margin-bottom: 24px; }

@media (max-width: 480px) { .scene { transform: scale(.8); height: 380px; } }
</style>
</head>

<body>
<div id="sparkles"></div>
<audio id="music" src="music/Honeybeeinstrumental.mp3" loop></audio>

<!-- ===================== PAGE 1: PASSWORD ===================== -->
<section class="page active" id="page-password">
  <form class="card" id="password-form" autocomplete="off">
    <div class="crown">👑</div>
    <h1 class="script">password</h1>
    <div class="divider">✦ ❦ ✦</div>
    <!-- the hint under the box; change it if you like -->
    <input type="text" id="password-input" placeholder=" clue: ur bday" inputmode="numeric" readonly>

    <div class="keypad">
    <button type="button" class="key" data-digit="1">1</button>
    <button type="button" class="key" data-digit="2">2</button>
    <button type="button" class="key" data-digit="3">3</button>
    <button type="button" class="key" data-digit="4">4</button>
    <button type="button" class="key" data-digit="5">5</button>
    <button type="button" class="key" data-digit="6">6</button>
    <button type="button" class="key" data-digit="7">7</button>
    <button type="button" class="key" data-digit="8">8</button>
    <button type="button" class="key" data-digit="9">9</button>
    <button type="button" class="key" data-digit="0">0</button>
    <button type="button" class="delete" id="delete-btn">x</button>
  </div> 
  <button type="submit" class="enter" id="enter-btn">Enter</button>
  <div class="error" id="error"></div>
  </form>
</section>

<!-- ===================== PAGE 2: CELEBRATION ===================== -->
<section class="page" id="page-celebration">
  <header class="hero">
    <div class="crown">👑</div>
    <h1 class="hb-title" id="hb-title" aria-label="Happy Birthday"></h1>
    <p class="to">to my dearest <span data-name></span> ♥</p>
    <div class="divider">✦ ❦ ✦</div>
    <p class="scroll-hint">scroll down ↓</p>
  </header>

  <!-- the photos get added here by the script -->
  <div class="gallery" id="gallery"></div>

  <div class="envelope-wrap">
    <p class="line script">okey tekan sini pulakk</p>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">
      <div class="env-back"></div>
      <div class="env-letter"></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="env-seal">♥</div>
    </div>
    <p class="tap">tap the envelope 💌</p>
  </div>
</section>

<!-- ===================== PAGE 3: THE LETTER ===================== -->
<section class="page" id="page-letter">
  <article class="letter">
    <h2>Dear <span data-name></span>,</h2>
    <div id="letter-body"><!-- your message is added here by the script --></div>
    <p class="sign">With all my love,<br><span data-from></span> ♥</p>
    <div class="letter-btn">
      <button class="btn" id="gift-btn">ni hadiah kau sbb ko ldr en🎁</button>
    </div>
  </article>
</section>

<!-- ===================== PAGE 4: THE GIFT ===================== -->
<section class="page" id="page-gift">
  <h1 class="script">For you, <span data-name></span></h1>
  <div class="scene">
    <div class="stage" id="stage"></div>
  </div>
  <p class="gift-text" id="final-message"></p>
  <button class="btn" id="restart-btn">Back to the start ♥</button>
</section>


<script>
/* =========================================================
   ✏️  EDIT THIS PART - your personal details
   ========================================================= */
const CONFIG = {
  name: "Ayunii",          // her name
  from: "Anisah comel",         // your name (signature on the letter)

  // Any of these will open the first page.
  // Spaces, slashes and capital letters don't matter.
  passwords: ["31082005", "31 August 2005", "31 Aug 2005"],

  // Your photos: put them in a folder called "photos" next to this file.
  // If a photo isn't found, a pretty placeholder shows instead.
  photos: [
    { src: "images/photo1.jpg", caption: "Our first volunteer together" },
    { src: "images/photo2.jpg", caption: "lurvee gmbr ni" },
    { src: "images/photo3.jpg", caption: "highschool core" },
    { src: "images/photo4.jpg", caption: "hntr you ke canadaa" },
    { src: "images/photo5.jpg", caption: "us time lepak rayaa" },
    { src: "images/photo6.jpg", caption: "Forever friends" }
  ],

  // Your letter. Each line in the list is one paragraph.
  letter: [
    "Happy Birthdayy broskii <3 thank you selalu drive kan saya ke mana ii senang nak lepak sbb kau weh",
    "semoga segala kebaikan di dunia and akhirat Allah rezekikan buat diri you sampai syurga tak putus nikmat",
    "jom jadi kawan lama ii, thank you do byk inspire aku through yout journey etc. sangat seronok lepak ngan kau"
  ],

  finalMessage: "sorry tau lambat siap hadiahh. Happy birthday Ayunii! 💖"
};


/* =========================================================
   Below is the code that makes everything work.
   You don't need to change it (but feel free to play!)
   ========================================================= */

// ---------- small helpers ----------
// Turns "31 / 08 / 2005" and "31 August 2005" into plain text for comparing
const normalize = text => text.toLowerCase().replace(/[^a-z0-9]/g, "");

// Show one page and hide all the others
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

// Fill in her name and your name everywhere
document.querySelectorAll("[data-name]").forEach(el => el.textContent = CONFIG.name);
document.querySelectorAll("[data-from]").forEach(el => el.textContent = CONFIG.from);


// ---------- PAGE 1: password ----------
const form  = document.getElementById("password-form");
const music = document.getElementById("music") 
const input = document.getElementById("password-input");
document.querySelectorAll(".key").forEach(key => {
  key.addEventListener("click", () => {
    input.value += key.dataset.digit;
  });
});
document.getElementById("delete-btn").addEventListener("click", ()=> {
  input.value = input.value.slice(0, -1);
}); 
const error = document.getElementById("error");

form.addEventListener("submit", event => {
  event.preventDefault();                       // stop the page from reloading
  console.log("submitted:", input.value);
  const typed = normalize(input.value);
  const correct = CONFIG.passwords.some(p => normalize(p) === typed);

  if (correct) {
    error.textContent = "";
    showPage("page-celebration");
    music.play();
  } else {
    error.textContent = "Hmm, that's not it. Try again, darling ♥";
    form.classList.add("shake");
    setTimeout(() => form.classList.remove("shake"), 500);
  }
});


// ---------- PAGE 2: animated title ----------
// Split "Happy Birthday" into single letters so each one can bounce
const title = document.getElementById("hb-title");
[..."Happy Birthday"].forEach((letter, i) => {
  const span = document.createElement("span");
  span.textContent = letter === " " ? "\u00A0" : letter;   // \u00A0 = a space that stays visible
  span.style.setProperty("--i", i);                        // used for the wave delay
  title.appendChild(span);
});

// ---------- PAGE 2: photos in golden frames ----------
// This fades each frame in when you scroll to it
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.2 });

const gallery = document.getElementById("gallery");
CONFIG.photos.forEach((photo, i) => {
  const frame = document.createElement("figure");
  frame.className = "frame";
  frame.style.setProperty("--tilt", (i % 2 ? 1.5 : -1.5) + "deg");   // slight cute tilt

  const mat = document.createElement("div");
  mat.className = "mat";

  const img = document.createElement("img");
  img.src = photo.src;
  img.alt = photo.caption;
  img.onerror = () => {                         // photo missing? show a placeholder
    const box = document.createElement("div");
    box.className = "placeholder";
    box.textContent = "Your photo here ♥";
    img.replaceWith(box);
  };

  const caption = document.createElement("figcaption");
  caption.textContent = photo.caption;

  mat.append(img, caption);
  frame.append(mat);
  gallery.append(frame);
  observer.observe(frame);
});

// ---------- PAGE 2 -> 3: the envelope ----------
const envelope = document.getElementById("envelope");
let opened = false;

function openEnvelope() {
  if (opened) return;
  opened = true;
  envelope.classList.add("open");                              // plays the opening animation
  setTimeout(() => showPage("page-letter"), 2000);            // then go to the letter
}
envelope.addEventListener("click", openEnvelope);
envelope.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") openEnvelope();
});

// ---------- PAGE 3: the letter ----------
const letterBody = document.getElementById("letter-body");
CONFIG.letter.forEach(text => {
  const p = document.createElement("p");
  p.textContent = text;
  letterBody.appendChild(p);
});

document.getElementById("gift-btn").addEventListener("click", () => showPage("page-gift"));


// ---------- PAGE 4: the spinning bouquet ----------
document.getElementById("final-message").textContent = CONFIG.finalMessage;

// Pairs of colors for the petals: [dark, light]
const PALETTE = [
  ["#8c1d38", "#b02a4a"],   // deep maroon rose
  ["#f09bb0", "#f6c6cf"],   // pink
  ["#f6d9c0", "#fbefdc"],   // cream
  ["#c9304f", "#e35d78"],   // red rose
  ["#e8798f", "#f4a6b6"]    // blush
];

// Builds one flower out of 8 petals + a golden middle
function makeFlower(size, colors) {
  const flower = document.createElement("div");
  flower.className = "flower";
  flower.style.setProperty("--s", size + "px");
  for (let i = 0; i < 8; i++) {
    const petal = document.createElement("i");
    petal.style.transform = `rotate(${i * 45}deg)`;
    petal.style.background = `radial-gradient(circle at 50% 85%, ${colors[1]}, ${colors[0]})`;
    flower.appendChild(petal);
  }
  flower.appendChild(document.createElement("b"));
  return flower;
}

function buildBouquet() {
  const stage = document.getElementById("stage");

  // Puts something at a 3D position (x = left/right, y = up/down, z = near/far).
  // The inner box turns the opposite way so everything always faces you.
  function place(x, y, z, element) {
    const holder = document.createElement("div");
    holder.className = "bb";
    holder.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
    const inner = document.createElement("div");
    inner.className = "bb-inner";
    inner.appendChild(element);
    holder.appendChild(inner);
    stage.appendChild(holder);
  }

  // 1. the wrapping paper cone
  const cone = document.createElement("div");
  cone.className = "cone";
  place(0, 8, 0, cone);

  // 2. green leaves in a ring
  for (let i = 0; i < 9; i++) {
    const angle = (i / 9) * Math.PI * 2;
    const radius = 70 + Math.random() * 25;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const leaf = document.createElement("div");
    leaf.className = "leaf";
    const lean = 40 + Math.random() * 30;
    leaf.style.transform = `rotate(${x > 0 ? lean : -lean}deg)`;
    place(x, -2, z, leaf);
  }

  // 3. flowers arranged in a round dome (sunflower-seed pattern)
  const total = 17;
  for (let i = 0; i < total; i++) {
    const angle = i * 2.39996;                   // the "golden angle"
    const radius = 20 * Math.sqrt(i);
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const y = -100 + (radius * radius) / 70;     // middle is highest
    place(x, y, z, makeFlower(48 + (i % 3) * 3, PALETTE[i % PALETTE.length]));
  }

  // 4. tiny white "baby's breath" dots
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 60 + Math.random() * 45;
    const dot = document.createElement("div");
    dot.className = "dot";
    place(Math.cos(angle) * radius, -110 + Math.random() * 100, Math.sin(angle) * radius, dot);
  }
}
buildBouquet();

// Back to the very beginning
document.getElementById("restart-btn").addEventListener("click", () => {
  opened = false;
  envelope.classList.remove("open");
  input.value = "";
  showPage("page-password");
});


// ---------- floating hearts and sparkles in the background ----------
const sparkleBox = document.getElementById("sparkles");
const symbols = ["♥", "✦", "✿", "✧", "❀"];
for (let i = 0; i < 26; i++) {
  const s = document.createElement("span");
  s.textContent = symbols[i % symbols.length];
  s.style.left = Math.random() * 100 + "%";
  s.style.fontSize = (10 + Math.random() * 18) + "px";
  s.style.animationDuration = (10 + Math.random() * 14) + "s";
  s.style.animationDelay = (-Math.random() * 20) + "s";
  s.style.color = i % 3 === 0 ? "rgba(246,198,207,.55)" : "rgba(243,220,138,.45)";
  sparkleBox.appendChild(s);
}
</script>
